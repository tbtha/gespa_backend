# BD en memoria para tests
spring.datasource.url=jdbc:h2:mem:gespa_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway deshabilitado en tests (H2 crea el esquema con Hibernate)
spring.flyway.enabled=false

# JWT
app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256
app.jwt.expiration-seconds=3600
app.jwt.refresh-expiration-seconds=86400

# Auth
app.auth.invitation.expiration-seconds=604800
app.auth.invitation.frontend-url=http://localhost:5173/aceptar-invitacion
app.auth.login.frontend-url=http://localhost:5173
app.auth.password-reset.expiration-seconds=3600
app.auth.password-reset.frontend-url=http://localhost:5173/reset-password
app.auth.password-reset.expose-token=true
app.auth.login.max-failed-attempts=10
app.auth.login.failed-window-seconds=900
app.auth.login.lock-seconds=900

# Correo deshabilitado en tests (HTTP API)
app.mail.http.enabled=false
app.mail.http.api-url=http://localhost/mock
app.mail.http.api-key=test-key
app.mail.enabled=false
app.mail.from=no-reply@gespa.cl
app.mail.from-name=GESPA

# CORS
app.cors.allowed-origins=http://localhost:5173

# Seed deshabilitado
app.seed.defaults.enabled=false
