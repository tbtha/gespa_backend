# Producción
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jackson.time-zone=America/Santiago

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
app.auth.invitation.expiration-seconds=${INVITATION_EXPIRATION_SECONDS:604800}
app.auth.password-reset.expiration-seconds=${PASSWORD_RESET_EXPIRATION_SECONDS:3600}
app.auth.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
app.auth.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:10}
app.auth.login.failed-window-seconds=${LOGIN_FAILED_WINDOW_SECONDS:900}
app.auth.login.lock-seconds=${LOGIN_LOCK_SECONDS:900}

app.security.dev-user=${DEV_SECURITY_USER:admin}
app.security.dev-password=${DEV_SECURITY_PASSWORD:change-this-password}

# Seed de usuarios por defecto
app.seed.defaults.enabled=${SEED_DEFAULTS_ENABLED:true}
app.seed.defaults.admin-email=${SEED_DEFAULTS_ADMIN_EMAIL:admin@gespa.local}
app.seed.defaults.admin-display-name=${SEED_DEFAULTS_ADMIN_DISPLAY_NAME:Administrador}
app.seed.defaults.admin-password=${SEED_DEFAULTS_ADMIN_PASSWORD:}
app.seed.defaults.shared-password=${SEED_DEFAULTS_SHARED_PASSWORD:Demo12345!}
app.seed.defaults.professional-email=${SEED_DEFAULTS_PROFESSIONAL_EMAIL:demo.professional@gespa.local}
app.seed.defaults.patient-email=${SEED_DEFAULTS_PATIENT_EMAIL:demo.patient@gespa.local}
app.seed.defaults.professional-display-name=${SEED_DEFAULTS_PROFESSIONAL_DISPLAY_NAME:Profesional Demo}
app.seed.defaults.patient-display-name=${SEED_DEFAULTS_PATIENT_DISPLAY_NAME:Paciente Demo}
app.seed.defaults.professional-specialty=${SEED_DEFAULTS_PROFESSIONAL_SPECIALTY:Medicina General}
app.seed.defaults.professional-rut=${SEED_DEFAULTS_PROFESSIONAL_RUT:12345678-5}
app.seed.defaults.patient-rut=${SEED_DEFAULTS_PATIENT_RUT:11111111-1}
