# MySQL local / XAMPP
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gespa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jackson.time-zone=America/Santiago

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true

# CORS frontend local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT placeholders
app.jwt.secret=${JWT_SECRET:change-this-secret-in-dev-too}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
app.auth.invitation.expiration-seconds=${INVITATION_EXPIRATION_SECONDS:604800}
app.auth.invitation.frontend-url=${INVITATION_FRONTEND_URL:http://localhost:5173/aceptar-invitacion}
app.auth.login.frontend-url=${LOGIN_FRONTEND_URL:http://localhost:5173}
app.auth.password-reset.expiration-seconds=${PASSWORD_RESET_EXPIRATION_SECONDS:3600}
app.auth.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
app.auth.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}
app.auth.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:10}
app.auth.login.failed-window-seconds=${LOGIN_FAILED_WINDOW_SECONDS:900}
app.auth.login.lock-seconds=${LOGIN_LOCK_SECONDS:900}

# Transporte de correo: http | smtp | auto
app.mail.transport=${MAIL_TRANSPORT:http}

# API HTTP (Brevo)
app.mail.http.enabled=${MAIL_HTTP_ENABLED:true}
app.mail.http.api-url=${MAIL_HTTP_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.http.api-key=${MAIL_HTTP_API_KEY:}
app.mail.http.connect-timeout-ms=${MAIL_HTTP_CONNECT_TIMEOUT_MS:5000}
app.mail.http.request-timeout-ms=${MAIL_HTTP_REQUEST_TIMEOUT_MS:10000}

# SMTP (Brevo u otro proveedor)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ae8d82001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@gespa.cl}
app.mail.from-name=${MAIL_FROM_NAME:GESPA}

# Usuario temporal de desarrollo
app.security.dev-user=${DEV_SECURITY_USER:admin}
app.security.dev-password=${DEV_SECURITY_PASSWORD:admin123}

# Seed de usuarios por defecto
app.seed.defaults.enabled=${SEED_DEFAULTS_ENABLED:true}
app.seed.defaults.admin-email=${SEED_DEFAULTS_ADMIN_EMAIL:admin@gespa.cl}
app.seed.defaults.admin-display-name=${SEED_DEFAULTS_ADMIN_DISPLAY_NAME:Administrador}
app.seed.defaults.admin-password=${SEED_DEFAULTS_ADMIN_PASSWORD:admin123!}
app.seed.defaults.shared-password=${SEED_DEFAULTS_SHARED_PASSWORD:admin123!}
app.seed.defaults.professional-email=${SEED_DEFAULTS_PROFESSIONAL_EMAIL:demo.profesional@gespa.cl}
app.seed.defaults.patient-email=${SEED_DEFAULTS_PATIENT_EMAIL:demo.paciente@gespa.cl}
app.seed.defaults.professional-display-name=${SEED_DEFAULTS_PROFESSIONAL_DISPLAY_NAME:Profesional Demo}
app.seed.defaults.patient-display-name=${SEED_DEFAULTS_PATIENT_DISPLAY_NAME:Paciente Demo}
app.seed.defaults.professional-specialty=${SEED_DEFAULTS_PROFESSIONAL_SPECIALTY:Medicina General}
app.seed.defaults.professional-rut=${SEED_DEFAULTS_PROFESSIONAL_RUT:22222222-2}
app.seed.defaults.patient-rut=${SEED_DEFAULTS_PATIENT_RUT:11111111-1}
